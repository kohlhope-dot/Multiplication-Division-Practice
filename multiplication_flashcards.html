<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplication Fact Flashcards</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#213047;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:clamp(23px,3vw,36px);margin:0}.sub{color:#65738a;margin:8px 0 24px}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 22px #1e35500d}.settings{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.facts label{cursor:pointer}.facts input{position:absolute;opacity:0}.facts span{display:inline-flex;align-items:center;justify-content:center;width:48px;height:46px;border:2px solid #d5dce9;border-radius:12px;font-weight:700;background:#fff}.facts input:checked+span{background:#dce9ff;color:#1749a6;border-color:#437cde}.facts input:focus-visible+span{outline:3px solid orange}.small{font-size:14px;color:#58677c}.action{border:0;border-radius:13px;padding:15px 24px;font-size:17px;font-weight:750;cursor:pointer;background:#245fd2;color:white}.action.secondary{background:#e9eef8;color:#23446e}.action:disabled{opacity:.45;cursor:not-allowed}.card{margin-top:20px;min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.problem{font-size:clamp(76px,13vw,145px);font-weight:800;letter-spacing:-.045em;line-height:1.15;font-variant-numeric:tabular-nums}.hint{font-size:19px;color:#738097;margin-top:12px}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}.buttons button{min-width:190px}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#68768c;font-size:14px}.toggle{display:flex;gap:8px;align-items:center}.toggle input{width:18px;height:18px}button.text{border:0;background:transparent;color:#245fd2;text-decoration:underline;cursor:pointer;font-size:14px}@media(max-width:550px){.wrap{padding:12px}.card{min-height:280px}.buttons button{flex:1;min-width:135px}}</style></head><body><main class="wrap"><header><h1>✏️ Multiplication Flashcards</h1><button class="action secondary" id="fullscreen">⛶ Full screen</button></header><p class="sub">Choose your facts, let students answer, then reveal!</p><section class="panel"><div class="settings"><strong>Fact families to practice</strong><div><button class="text" id="selectall">Select all</button> · <button class="text" id="clear">Clear</button></div></div><div class="facts" id="facts"></div><div class="settings" style="margin-top:16px"><label class="toggle"><input type="checkbox" id="swap" checked> Mix factor order (2 × 5 and 5 × 2)</label><label class="toggle">Other factor up to <select id="max" style="padding:7px;border-radius:8px;border:1px solid #cbd5e1"><option value="10">10</option><option value="12" selected>12</option></select></label></div></section><section class="panel card" aria-live="polite"><div class="problem" id="problem">5 × 2 = ?</div><div class="hint" id="hint">Let students answer aloud!</div></section><div class="buttons"><button class="action secondary" id="reveal">👀 Reveal answer</button><button class="action" id="next">Next problem →</button></div><div class="footer"><span id="count">Problems shown: 1</span><span>Keyboard: Space = reveal · Enter / → = next</span></div></main><script>const facts=document.querySelector('#facts'),problem=document.querySelector('#problem'),hint=document.querySelector('#hint'),reveal=document.querySelector('#reveal'),next=document.querySelector('#next');let current=[5,2],shown=false,count=1,last='5,2';for(let i=0;i<=12;i++){let l=document.createElement('label');l.innerHTML=`<input type="checkbox" value="${i}" ${[0,1,2,5].includes(i)?'checked':''}><span>${i}s</span>`;facts.append(l)}function chosen(){return [...facts.querySelectorAll('input:checked')].map(x=>+x.value)}function refresh(){next.disabled=!chosen().length}facts.addEventListener('change',refresh);document.querySelector('#selectall').onclick=()=>{facts.querySelectorAll('input').forEach(x=>x.checked=true);refresh()};document.querySelector('#clear').onclick=()=>{facts.querySelectorAll('input').forEach(x=>x.checked=false);refresh()};function draw(){problem.textContent=`${current[0]} × ${current[1]} = ${shown?current[0]*current[1]:'?'}`;hint.textContent=shown?'Answer revealed! Ready for another?':'Let students answer aloud!';reveal.textContent=shown?'🙈 Hide answer':'👀 Reveal answer'}reveal.onclick=()=>{shown=!shown;draw()};next.onclick=()=>{const a=chosen();if(!a.length)return;let pair;let attempts=0;do{let x=a[Math.floor(Math.random()*a.length)],y=Math.floor(Math.random()*(+document.querySelector('#max').value+1));pair=document.querySelector('#swap').checked&&Math.random()<.5?[y,x]:[x,y];attempts++}while(pair.join(',')===last&&attempts<30);current=pair;last=pair.join(',');shown=false;count++;document.querySelector('#count').textContent=`Problems shown: ${count}`;draw()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();reveal.click()}else if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next.click()}});document.querySelector('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};refresh();</script></body></html>
