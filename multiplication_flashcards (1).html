<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplication Fact Fluency Challenge</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#213047;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:clamp(23px,3vw,36px);margin:0}.sub{color:#65738a;margin:8px 0 24px}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 22px #1e35500d}.settings{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.facts label{cursor:pointer}.facts input{position:absolute;opacity:0}.facts span{display:inline-flex;align-items:center;justify-content:center;width:48px;height:46px;border:2px solid #d5dce9;border-radius:12px;font-weight:700;background:#fff}.facts input:checked+span{background:#dce9ff;color:#1749a6;border-color:#437cde}.facts input:focus-visible+span{outline:3px solid orange}.small{font-size:14px;color:#58677c}.action{border:0;border-radius:13px;padding:15px 24px;font-size:17px;font-weight:750;cursor:pointer;background:#245fd2;color:white}.action.secondary{background:#e9eef8;color:#23446e}.action:disabled{opacity:.45;cursor:not-allowed}.card{margin-top:20px;min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.problem{font-size:clamp(76px,13vw,145px);font-weight:800;letter-spacing:-.045em;line-height:1.15;font-variant-numeric:tabular-nums}.hint{font-size:19px;color:#738097;margin-top:12px}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}.buttons button{min-width:190px}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#68768c;font-size:14px}.toggle{display:flex;gap:8px;align-items:center}.toggle input{width:18px;height:18px}button.text{border:0;background:transparent;color:#245fd2;text-decoration:underline;cursor:pointer;font-size:14px}@media(max-width:550px){.wrap{padding:12px}.card{min-height:280px}.buttons button{flex:1;min-width:135px}}.timer-panel{margin-top:18px;text-align:center}.timer-heading{font-size:15px;font-weight:800;color:#405477;margin-bottom:12px}.timer-options,.timer-controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.timer-options button{border:2px solid #d5dce9;background:#fff;color:#284368;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:750;cursor:pointer}.timer-options button.selected{border-color:#245fd2;background:#dce9ff;color:#1749a6}.timer-display{font-size:clamp(50px,8vw,88px);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.05em;margin:8px 0;line-height:1.2}.timer-display.finished{color:#bb3434}.timer-status{color:#65738a;font-size:15px;min-height:22px;margin-bottom:12px}.timer-controls .action{padding:11px 20px;font-size:15px}.timer-progress{height:9px;border-radius:20px;background:#e9eef8;overflow:hidden;max-width:530px;margin:14px auto 0}.timer-progress-fill{height:100%;background:#245fd2;width:100%;transition:width .2s linear}.timer-progress-fill.finished{background:#bb3434}@media(max-width:550px){.timer-options button{padding:9px 11px}}</style></head><body><main class="wrap"><header><h1>✏️ Multiplication Fact Fluency Challenge</h1><button class="action secondary" id="fullscreen">⛶ Full screen</button></header><p class="sub">Choose your facts, let students answer, then reveal!</p><section class="panel"><div class="settings"><strong>Fact families to practice</strong><div><button class="text" id="selectall">Select all</button> · <button class="text" id="clear">Clear</button></div></div><div class="facts" id="facts"></div><div class="settings" style="margin-top:16px"><label class="toggle"><input type="checkbox" id="swap" checked> Mix factor order (2 × 5 and 5 × 2)</label><label class="toggle">Other factor up to <select id="max" style="padding:7px;border-radius:8px;border:1px solid #cbd5e1"><option value="10">10</option><option value="12" selected>12</option></select></label></div></section><section class="panel timer-panel" aria-label="Practice timer"><div class="timer-heading">⏱️ Practice countdown</div><div class="timer-options" role="group" aria-label="Timer duration"><button type="button" data-seconds="30">30 seconds</button><button type="button" data-seconds="60">1 minute</button><button type="button" data-seconds="300" class="selected">5 minutes</button><button type="button" data-seconds="0">No timer</button></div><div class="timer-display" id="timerDisplay" role="timer" aria-label="Time remaining">05:00</div><div class="timer-status" id="timerStatus" aria-live="polite">Ready when you are!</div><div class="timer-controls"><button type="button" class="action" id="timerStart">▶ Start</button><button type="button" class="action secondary" id="timerReset">↻ Reset</button></div><div class="timer-progress" id="timerProgress"><div class="timer-progress-fill" id="timerBar"></div></div></section><section class="panel card" aria-live="polite"><div class="problem" id="problem">5 × 2 = ?</div><div class="hint" id="hint">Let students answer aloud!</div></section><div class="buttons"><button class="action secondary" id="reveal">👀 Reveal answer</button><button class="action" id="next">Next problem →</button></div><div class="footer"><span id="count">Problems shown: 1</span><span>Keyboard: Space = reveal · Enter / → = next</span></div></main><script>const facts=document.querySelector('#facts'),problem=document.querySelector('#problem'),hint=document.querySelector('#hint'),reveal=document.querySelector('#reveal'),next=document.querySelector('#next');let current=[5,2],shown=false,count=1,last='5,2';for(let i=0;i<=12;i++){let l=document.createElement('label');l.innerHTML=`<input type="checkbox" value="${i}" ${[0,1,2,5].includes(i)?'checked':''}><span>${i}s</span>`;facts.append(l)}function chosen(){return [...facts.querySelectorAll('input:checked')].map(x=>+x.value)}function refresh(){next.disabled=!chosen().length}facts.addEventListener('change',refresh);document.querySelector('#selectall').onclick=()=>{facts.querySelectorAll('input').forEach(x=>x.checked=true);refresh()};document.querySelector('#clear').onclick=()=>{facts.querySelectorAll('input').forEach(x=>x.checked=false);refresh()};function draw(){problem.textContent=`${current[0]} × ${current[1]} = ${shown?current[0]*current[1]:'?'}`;hint.textContent=shown?'Answer revealed! Ready for another?':'Let students answer aloud!';reveal.textContent=shown?'🙈 Hide answer':'👀 Reveal answer'}reveal.onclick=()=>{shown=!shown;draw()};next.onclick=()=>{const a=chosen();if(!a.length)return;let pair;let attempts=0;do{let x=a[Math.floor(Math.random()*a.length)],y=Math.floor(Math.random()*(+document.querySelector('#max').value+1));pair=document.querySelector('#swap').checked&&Math.random()<.5?[y,x]:[x,y];attempts++}while(pair.join(',')===last&&attempts<30);current=pair;last=pair.join(',');shown=false;count++;document.querySelector('#count').textContent=`Problems shown: ${count}`;draw()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();reveal.click()}else if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next.click()}});document.querySelector('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};refresh();
// Countdown runs independently of flashcard navigation.
const timerDisplay=document.querySelector('#timerDisplay'),timerStatus=document.querySelector('#timerStatus'),timerStart=document.querySelector('#timerStart'),timerReset=document.querySelector('#timerReset'),timerBar=document.querySelector('#timerBar'),timerProgress=document.querySelector('#timerProgress');
let timerDuration=300,remainingMs=300000,timerRunning=false,timerDeadline=0,timerInterval=null;
function formatTime(ms){const seconds=Math.ceil(Math.max(0,ms)/1000);return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function paintTimer(){timerDisplay.textContent=timerDuration===0?'∞':formatTime(remainingMs);timerBar.style.width=timerDuration?`${Math.min(100,Math.max(0,remainingMs/(timerDuration*1000)*100))}%`:'100%';const finished=timerDuration>0&&remainingMs<=0;timerDisplay.classList.toggle('finished',finished);timerBar.classList.toggle('finished',finished);timerStart.disabled=timerDuration===0||finished;timerReset.disabled=timerDuration===0;timerStart.textContent=timerRunning?'⏸ Pause':'▶ Start';timerProgress.hidden=timerDuration===0;}
function stopClock(){if(timerInterval!==null){clearInterval(timerInterval);timerInterval=null}timerRunning=false}
function tick(){if(!timerRunning)return;remainingMs=Math.max(0,timerDeadline-performance.now());if(remainingMs<=0){stopClock();timerStatus.textContent="🎉 Time's up! You did great!";}paintTimer()}
function resetClock(){stopClock();remainingMs=timerDuration*1000;timerStatus.textContent=timerDuration?'Ready when you are!':'Untimed practice — take your time!';paintTimer()}
document.querySelectorAll('[data-seconds]').forEach(button=>button.addEventListener('click',()=>{timerDuration=Number(button.dataset.seconds);document.querySelectorAll('[data-seconds]').forEach(b=>b.classList.toggle('selected',b===button));resetClock()}));
timerStart.addEventListener('click',()=>{if(timerRunning){remainingMs=Math.max(0,timerDeadline-performance.now());stopClock();timerStatus.textContent='Paused';}else if(timerDuration&&remainingMs>0){timerDeadline=performance.now()+remainingMs;timerRunning=true;timerStatus.textContent='Keep going! You’ve got this!';timerInterval=setInterval(tick,100);}paintTimer()});
timerReset.addEventListener('click',resetClock);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});paintTimer();
</script></body></html>
